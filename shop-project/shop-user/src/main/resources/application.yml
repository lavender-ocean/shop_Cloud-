server:
  port: 8082
spring:
  autoconfigure:
    exclude: com.github.pagehelper.autoconfigure.PageHelperAutoConfiguration
  application:
    name: shop-user
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        namespace: dev
        group: DEFAULT_GROUP
      config:
        namespace: dev
        group: DEFAULT_GROUP
        file-extension: yaml
  config:
    import:
      - optional:nacos:common-dev.yaml
      - optional:nacos:datasource-dev.yaml
      - optional:nacos:shop-user-dev.yaml

server:
  port: 8083

spring:
  application:
    name: shop-product
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery: { namespace: dev, group: DEFAULT_GROUP }
      config:    { namespace: dev, group: DEFAULT_GROUP, file-extension: yaml }
  config:
    import:
      - optional:nacos:common-dev.yaml
      - optional:nacos:shop-product-dev.yaml